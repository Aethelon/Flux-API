services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - flux-postgres-data:/var/lib/postgresql/data

volumes:
  flux-postgres-data:

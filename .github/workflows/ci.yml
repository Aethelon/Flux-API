name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flux
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: flux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d flux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3333
      LOG_LEVEL: silent
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgres://flux:flux@127.0.0.1:5432/flux
      DATABASE_POOL_MAX: 4
      JWT_ACCESS_SECRET: test-secret-with-at-least-thirty-two-characters
      JWT_ACCESS_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      RUN_PHASE_ONE_INTEGRATION: 1
      RUN_PHASE_TWO_INTEGRATION: 1
      RUN_PHASE_THREE_INTEGRATION: 1
      RUN_PHASE_FOUR_INTEGRATION: 1
      RUN_PHASE_FIVE_INTEGRATION: 1
      RUN_SERVICE_ORDER_COLUMNS_INTEGRATION: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
